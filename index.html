<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JJS Animation Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>JJS Animation Converter</h1>

        <section class="upload-section">

            <h2>Импорт RBXM</h2>

            <p>
                Выберите файл Roblox Model (.rbxm)
            </p>

            <input
                type="file"
                id="rbxmFile"
                accept=".rbxm"
            >

        </section>


        <section class="result-section">

            <h2>Информация</h2>

            <pre id="output">Файл не выбран</pre>

        </section>


        <section class="tree-section">

            <h2>Структура RBXM</h2>

            <div id="tree">
                Здесь появится структура загруженного файла.
            </div>

        </section>

    </main>


    <!--
        ВАЖНО:
        rbxm.js должен загружаться раньше app.js,
        потому что app.js использует window.RBXM.
    -->

    <script src="js/rbxm.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
